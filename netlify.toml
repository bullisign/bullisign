[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Alle Seiten liegen als fertiges HTML vor (Prerendering, siehe scripts/prerender.mjs).
# Unbekannte Adressen bekommen automatisch dist/404.html mit Status 404.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
